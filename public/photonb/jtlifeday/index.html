const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,saltB64){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);

async function decryptWith(key,L){return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(L.iv)},key,b64(L.ct))));}
async function decryptLocked(L,pw){return decryptWith(KEY||await deriveKey(pw,L.salt),L);}
function privHTML(P){let h='';if(P.spend&&P.spend.length){const sums={};P.spend.forEach(x=>{const c=x.cur||'NT$';sums[c]=(sums[c]||0)+(+x.amount||0)});
  h+='<table>'+P.spend.map(x=>`<tr><td>${esc(x.item)}${x.invoice_no?` <span style="color:var(--muted)">${esc(x.invoice_no)}</span>`:''}${x.pay?` · ${esc(x.pay)}`:''}</td><td class="amt">${esc(x.cur||'NT$')} ${(+x.amount).toLocaleString()}</td></tr>`).join('')+Object.entries(sums).map(([c,v])=>`<tr><td class="sum">合計</td><td class="amt sum">${esc(c)} ${v.toLocaleString()}</td></tr>`).join('')+`</table>`;}
 if(P.partner)h+=`<div>🤝 ${esc(P.partner)}</div>`;if(P.background)h+=`<div style="margin-top:.4rem"><b>${esc(P.background.title)}</b><pre>${esc(P.background.text)}</pre></div>`;if(P.note)h+=`<div style="color:var(--muted);font-size:.78rem">${esc(P.note)}</div>`;return h||'（沒有內容）';}
const PKEY='lifeday_pending_v1';
function pend(){try{return JSON.parse(localStorage.getItem(PKEY)||'{}')}catch(e){return {}}}
function wantHidden(e){const p=pend();return (e.id in p)?p[e.id]:!!e.hidden;}
function togglePend(id){const e=E.find(x=>x.id===id),p=pend(),now=wantHidden(e);if((!now)===!!e.hidden)delete p[id];else p[id]=!now;try{localStorage.setItem(PKEY,JSON.stringify(p))}catch(err){}render();drawPend();}
function drawPend(){const box=document.getElementById('pend'),p=pend(),ids=Object.keys(p).filter(id=>E.find(x=>x.id===id));if(ROLE!=='james'||!ids.length){box.style.display='none';return;}
 const lines=ids.map(id=>{const e=E.find(x=>x.id===id);return (p[id]?'加密 ':'解除加密 ')+id+' '+e.title}).join('\n');
 box.style.display='block';box.innerHTML='🔑 這台裝置上已先照你的設定顯示。要讓<b>所有裝置</b>都生效（真的從網頁拿掉），把下面這段貼給 Robert：<textarea readonly>'+esc(lines)+'</textarea><button id="pcopy">📋 複製</button>';
 document.getElementById('pcopy').onclick=ev=>{const t=box.querySelector('textarea');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).catch(()=>document.execCommand('copy'));ev.target.textContent='✅ 已複製';};}
const _pass=pass;
const visible=e=>PW?true:!wantHidden(e);
async function login(pw,quiet){if(!AUTH||!AUTH.length){if(!quiet)alert('尚未設定密碼');return false;}
 let me=null;for(const A of AUTH){try{const k=await deriveKey(pw,A.salt);me=await decryptWith(k,A);KEY=k;break;}catch(err){}}
 if(!me){if(!quiet)alert('密碼不對');return false;}
 PW=pw;ROLE=me.role;WHO=me.name;try{sessionStorage.setItem('lifeday_pw',pw)}catch(e){}
 for(const L of HIDDEN){if(L.r!==ROLE)continue;try{const e=await decryptWith(KEY,L);e.hidden=true;e._priv=e.private;if(!E.find(x=>x.id===e.id))E.push(e);}catch(err){}}
 if(ROLE==='james'){for(const e of E){if(e.locked&&!e._priv){try{e._priv=await decryptWith(KEY,e.locked);}catch(err){}}}}
 E.sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));keyUI();drawFilters();render();drawPend();drawCal();return true;}
function logout(){try{sessionStorage.removeItem('lifeday_pw')}catch(e){}location.reload();}
function keyUI(){const k=document.getElementById('keybtn');k.textContent=PW?('🔓 '+(ROLE==='james'?'已登入':WHO)):'🔑 登入';k.classList.toggle('in',!!PW);}
document.getElementById('keybtn').onclick=()=>{if(PW){if(confirm('登出？'))logout();}else{const pw=prompt('輸入密碼登入');if(pw)login(pw,false);}};
document.addEventListener('click',ev=>{const b=ev.target.closest('.unlock');if(!b)return;const pw=prompt('輸入密碼登入');if(pw)login(pw,false);});

// ── 月曆（James 2026-09-22）：📅 展開；有記事的日子標點（登入前只算公開篇）；點日期＝只看那天＋捲到那天第一篇；再點取消
const CAL=document.getElementById('cal'); let calY=new Date().getFullYear(), calM=new Date().getMonth(), calOpen=false;
function daysWithPosts(){const s=new Set(); E.forEach(e=>{ if((PW||!wantHidden(e))&&qhit(e)) s.add(e.date); }); return s;}
function drawCal(){ if(!calOpen){CAL.classList.remove('open');return;} CAL.classList.add('open');
 const has=daysWithPosts(); const first=new Date(calY,calM,1); const startDow=(first.getDay()+6)%7; const nd=new Date(calY,calM+1,0).getDate(); const today=new Date().toISOString().slice(0,10);
 let h=`<div class="ch"><button data-m="-1">‹</button><b>${calY} 年 ${calM+1} 月</b><button data-m="1">›</button></div><div class="g">`+['一','二','三','四','五','六','日'].map(w=>`<div class="wd">${w}</div>`).join('');
 for(let i=0;i<startDow;i++) h+='<div class="d"></div>';
 for(let d=1;d<=nd;d++){ const key=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const cls=['d',has.has(key)?'has':'',key===curDay?'sel':'',key===today?'today':''].join(' '); h+=`<div class="${cls}" data-day="${key}">${d}</div>`; }
 h+='</div>'; const months=[...has].map(x=>x.slice(0,7)).sort(); const cnt=[...has].filter(x=>x.startsWith(`${calY}-${String(calM+1).padStart(2,'0')}`)).length;
 h+=`<div class="cf">這個月有記事 ${cnt} 天${curDay?`　·　正在只看 ${curDay}<button id="calclear">全部顯示</button>`:''}${months.length?`　·　最早 ${months[0]}`:''}</div>`;
 CAL.innerHTML=h;
 CAL.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{calM+=+b.dataset.m; if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;} drawCal();});
 CAL.querySelectorAll('.d.has').forEach(d=>d.onclick=()=>{ const k=d.dataset.day; curDay=(curDay===k)?null:k; drawFilters(); render(); drawCal(); if(curDay){ const a=document.querySelector(`article[data-date="${curDay}"]`); if(a) a.scrollIntoView({behavior:'smooth',block:'start'}); } });
 const cc=document.getElementById('calclear'); if(cc) cc.onclick=()=>{curDay=null;drawFilters();render();drawCal();};
}
document.getElementById('calbtn').onclick=()=>{ calOpen=!calOpen; if(calOpen){ const days=[...daysWithPosts()].sort(); if(days.length&&!curDay){ const last=days[days.length-1]; calY=+last.slice(0,4); calM=+last.slice(5,7)-1; } } drawCal(); };
const LB=document.getElementById('lb'),BOX=document.getElementById('lbbox'),CAP=document.getElementById('lbcap');let G=[],GI=0;
function openLB(e,n){const base=e.base||('img/'+e.date+'/');G=e.photos.map(p=>({src:base+p.f,video:p.video?base+p.video:null,cap:p.cap}));if(e.grid)G.push({src:base+e.grid,video:null,cap:'拼貼'});(e.album||[]).forEach(p=>G.push({src:base+p.f,video:null,cap:(p.r?'★'.repeat(+p.r)+'　':'')+(p.cap||p.name||'')}));GI=n;LB.style.display='flex';showLB();}
function showLB(){const g=G[GI];BOX.innerHTML=g.video?`<video src="${g.video}" poster="${g.src}" controls autoplay playsinline loop></video>`:`<img src="${g.src}" alt="">`;CAP.textContent=(GI+1)+' / '+G.length+'　'+g.cap;}
function stepLB(d){GI=(GI+d+G.length)%G.length;showLB();}
function closeLB(){LB.style.display='none';BOX.innerHTML='';}
LB.querySelector('.prev').onclick=e=>{e.stopPropagation();stepLB(-1)};LB.querySelector('.next').onclick=e=>{e.stopPropagation();stepLB(1)};LB.querySelector('.x').onclick=closeLB;
LB.onclick=e=>{if(e.target===LB)closeLB()};
document.addEventListener('keydown',e=>{if(LB.style.display!=='flex')return;if(e.key==='ArrowLeft')stepLB(-1);else if(e.key==='ArrowRight')stepLB(1);else if(e.key==='Escape')closeLB();});
let tx=null,ty=null;LB.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
LB.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3)stepLB(dx<0?1:-1);else if(dy>90&&Math.abs(dy)>Math.abs(dx))closeLB();},{passive:true});
render();(async()=>{let spw=null;try{spw=sessionStorage.getItem('lifeday_pw')}catch(e){} if(spw)await login(spw,true);})();
