<!doctype html>
<html lang="zh-TW" data-skin="wenqing"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/><title>JT Life Day · 生活記事</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--ink:#2d2a26;--muted:#8a8174;--line:#d9cfbf;--card:#fffdf8;--accent:#a4572b;--font:'Noto Serif TC',serif}
:root[data-skin="cinema"]{--bg:#0b0b0d;--ink:#ecebe7;--muted:#8d8b85;--line:#2a2a2e;--card:#121215;--accent:#e0b04a;--font:'Noto Sans TC',sans-serif}
*{box-sizing:border-box} html,body{overflow-x:hidden} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.9;transition:background .3s,color .3s}
.wrap{max-width:760px;margin:0 auto;padding:1.4rem 16px 5rem}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:.9rem;margin-bottom:1.6rem}
h1{font-size:1.5rem;margin:0;letter-spacing:.12em;font-weight:900} h1 small{display:block;font-size:.7rem;color:var(--muted);letter-spacing:.35em;font-weight:400}
.skins button,.filters button,.copy button{font-family:inherit;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.2rem .8rem;font-size:.78rem;cursor:pointer}
.skins button.on,.filters button.on{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.filters{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 1.4rem}
article{background:var(--card);border:1px solid var(--line);margin:0 0 2.4rem;padding:1.3rem 1.2rem 1.1rem}
.date{font-size:.74rem;letter-spacing:.3em;color:var(--muted)} h2{font-size:1.25rem;margin:.2rem 0 .3rem;font-weight:600}
.meta{font-size:.8rem;color:var(--muted);margin-bottom:.9rem} .meta b{color:var(--accent);font-weight:600}
.hero{width:100%;display:block} .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px} .thumbs figure{margin:0} .thumbs img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;cursor:zoom-in}
figcaption{font-size:.72rem;color:var(--muted);margin-top:.2rem;line-height:1.5}
.mood{font-size:1rem;margin:1rem 0 .6rem;padding-left:.9rem;border-left:3px solid var(--accent)}
h3{font-size:.78rem;letter-spacing:.28em;color:var(--accent);margin:1.2rem 0 .3rem;font-weight:600} ul{margin:.2rem 0;padding-left:1.1rem} li{margin:.15rem 0;font-size:.92rem}
.kcal{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:0 .5rem;margin-left:.3rem;color:var(--muted)}
.warn{font-size:.8rem;color:var(--accent)} .ocr{font-size:.82rem;color:var(--muted)} .ocr span{color:var(--ink)}
.copy{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem} .copy button:hover{color:var(--ink);border-color:var(--ink)}
pre{white-space:pre-wrap;font-family:inherit;font-size:.86rem;background:transparent;border:1px dashed var(--line);padding:.7rem .8rem;margin:.5rem 0 0;display:none} pre.show{display:block}
.tags{margin-top:.9rem;font-size:.74rem;color:var(--muted)} .tags span{margin-right:.6rem}
/* 文青：紙感、拍立得留白 */
:root[data-skin="wenqing"] article{box-shadow:0 8px 24px rgba(80,60,30,.08);border-radius:2px} :root[data-skin="wenqing"] .hero{padding:10px 10px 0;background:#fff;border:1px solid var(--line);border-bottom:0} :root[data-skin="wenqing"] .herocap{background:#fff;border:1px solid var(--line);border-top:0;padding:.35rem 10px .6rem;font-size:.78rem;color:var(--muted);text-align:center;letter-spacing:.1em}
/* 電影：寬銀幕、字幕、時間碼 */
:root[data-skin="cinema"] article{border-radius:0;padding:0 0 1.1rem;border-left:0;border-right:0} :root[data-skin="cinema"] article>*:not(.herowrap){margin-left:1.1rem;margin-right:1.1rem}
:root[data-skin="cinema"] .herowrap{position:relative;background:#000;margin-bottom:1rem} :root[data-skin="cinema"] .hero{aspect-ratio:2.39/1;object-fit:cover;filter:contrast(1.06) saturate(.85)}
:root[data-skin="cinema"] .herocap{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-size:.92rem;color:#fff;text-shadow:0 1px 6px #000;letter-spacing:.08em;padding:0 1rem}
:root[data-skin="cinema"] .date{font-family:ui-monospace,Menlo,monospace;letter-spacing:.18em;color:var(--accent)} :root[data-skin="cinema"] h2{font-weight:700;letter-spacing:.06em} :root[data-skin="cinema"] .thumbs img{aspect-ratio:16/9;filter:saturate(.85)}
:root[data-skin="cinema"] .mood{border-left-color:var(--accent);font-style:italic;font-weight:300}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out} #lb img{max-width:96vw;max-height:94vh}
footer{color:var(--muted);font-size:.72rem;text-align:center;margin-top:3rem;letter-spacing:.1em}
</style></head><body><div class="wrap">
<header><h1><small>JT LIFE DAY</small>生活記事</h1><div class="skins"><button data-s="wenqing">文青</button> <button data-s="cinema">電影</button></div></header>
<div class="filters" id="filters"></div><main id="list"></main>
<footer>拍照＋一句話，其餘交給 Robert · 私人記事，未列入索引</footer></div><div id="lb"><img alt=""></div>
<script>
const E=[{"id": "2026-09-21-01", "date": "2026-09-21", "weekday": "一", "time": "12:46–13:02", "type": "餐食", "title": "花月嵐拉麵｜藤崎家太鹹，下次避開", "place": "花月嵐拉麵（松山車站・CITYLINK 一帶）", "area": "台北・松山車站", "place_source": "照片 GPS → 開放地圖 34 公尺內拉麵店＋餐巾紙上的「嵐 ARASHI」標誌", "dishes": [{"name": "藤崎家拉麵（橫濱家系）", "detail": "雞油提香的醬油豚骨、粗麵、海苔三片、菠菜、溏心蛋、蔥花。", "kcal": 900}, {"name": "冰茶", "detail": "玻璃杯加冰，看起來是無糖茶", "kcal": 5}], "kcal_total": 905, "kcal_note": "看圖估算，誤差約 ±30%", "ocr": [{"src": "IMG_0150 海報", "jp": "豚骨と魚ダシによるＷスープの決定版!! 豚そば銀次郎／銀次郎魚豚骨拉麵", "zh": "豚骨加魚高湯的雙湯頭決定版"}, {"src": "IMG_0152 海報", "jp": "鶏油仕立ての醤油豚骨!! 横浜家系ラーメン 藤崎家／藤崎家拉麵", "zh": "雞油提香的醬油豚骨，橫濱家系拉麵"}, {"src": "IMG_0152 桌上立牌", "jp": "無料 FREE トッピング", "zh": "桌上配料免費自取（大蒜、辣豆芽等）"}], "people": "未記錄（照片裡沒有同行者）", "rating": 2, "verdict": "太鹹，以後避開。（James 2026-09-21）", "mood": "橘色吊燈、深色牆，一個人的午餐也有一點儀式感。", "photos": [{"f": "IMG_0149.jpg", "cap": "夾起來的粗麵，湯頭濃到掛麵"}, {"f": "IMG_0152.jpg", "cap": "橘燈下的藤崎家海報與免費配料台"}, {"f": "IMG_0151.jpg", "cap": "店裡的橘色吊燈"}, {"f": "IMG_0150.jpg", "cap": "另一款：銀次郎魚豚骨"}], "grid": "grid_馬賽克_方形_原色.jpg", "tags": ["拉麵", "日式", "松山車站", "午餐", "避雷"], "voiceover": false, "social": {"ig": "松山車站旁的午餐，試了花月嵐的橫濱家系「藤崎家」。\n海苔三片、菠菜、溏心蛋，配置很標準，\n但湯頭對我來說太鹹了，下次換一碗試試。\n倒是店裡的橘色吊燈，比麵還上相。\n\n📍 花月嵐拉麵｜松山車站\n🍜 藤崎家拉麵＋冰茶\n\n#台北美食 #松山車站美食 #花月嵐 #家系拉麵 #拉麵筆記 #一個人的午餐 #taipeifood #ramen", "fb": "今天中午在松山車站旁的花月嵐試了橫濱家系的「藤崎家拉麵」。\n海苔三片、菠菜、溏心蛋、粗麵，配置很標準，湯頭是雞油提香的醬油豚骨——對我來說太鹹了，記一筆，下次避開，改試銀次郎魚豚骨。\n店裡的橘色吊燈配深色牆，拍起來意外好看。", "threads": "花月嵐的藤崎家拉麵：配置標準，但太鹹，記一筆下次避開。橘色吊燈倒是比麵上相 🍜"}, "avoid": ["藤崎家拉麵"]}];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setSkin(s){document.documentElement.dataset.skin=s;document.querySelectorAll('.skins button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));try{localStorage.setItem('lifeday_skin',s)}catch(e){}}
let skin='wenqing';try{skin=localStorage.getItem('lifeday_skin')||skin}catch(e){} setSkin(skin);
document.querySelectorAll('.skins button').forEach(b=>b.onclick=()=>setSkin(b.dataset.s));
const types=['全部',...new Set(E.map(e=>e.type))];let cur='全部';
const F=document.getElementById('filters');F.innerHTML=types.map(t=>`<button data-t="${esc(t)}" class="${t===cur?'on':''}">${esc(t)}</button>`).join('');
F.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.t;F.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render()});
function render(){document.getElementById('list').innerHTML=E.filter(e=>cur==='全部'||e.type===cur).map((e,i)=>{const base='img/'+e.date+'/';const hero=e.photos[0];
 return `<article><div class="herowrap"><img class="hero zoom" src="${base+hero.f}" alt=""><div class="herocap">${esc(hero.cap)}</div></div>
 <div class="date">${esc(e.date)}（${esc(e.weekday)}）${esc(e.time)}</div><h2>${esc(e.title)}</h2>
 <div class="meta">📍 ${esc(e.place)}　·　估 <b>${e.kcal_total}</b> 大卡　·　同行：${esc(e.people)}</div>
 <div class="thumbs">${e.photos.slice(1).map(p=>`<figure><img class="zoom" src="${base+p.f}" alt="" loading="lazy"><figcaption>${esc(p.cap)}</figcaption></figure>`).join('')}${e.grid?`<figure><img class="zoom" src="${base+e.grid}" alt="" loading="lazy"><figcaption>拼貼（可直接發）</figcaption></figure>`:''}</div>
 <div class="mood">${esc(e.mood)}</div>
 <h3>吃了什麼</h3><ul>${e.dishes.map(d=>`<li><b>${esc(d.name)}</b><span class="kcal">約 ${d.kcal} 大卡</span><br>${esc(d.detail)}${d.confirm?`<div class="warn">⚠️ ${esc(d.confirm)}</div>`:''}</li>`).join('')}</ul>
 <h3>評價</h3><div>${e.rating?('★'.repeat(e.rating)+'　'):''}${esc(e.verdict)}</div>
 <h3>照片裡的文字</h3>${e.ocr.map(o=>`<div class="ocr">${esc(o.src)}：${esc(o.jp)} → <span>${esc(o.zh)}</span></div>`).join('')}
 <h3>拿去發文</h3><div class="copy">${['ig','fb','threads'].map(k=>`<button data-i="${i}" data-k="${k}">複製 ${k==='ig'?'IG':k==='fb'?'FB':'Threads'} 文案</button>`).join('')}</div><pre id="pre${i}"></pre>
 <div class="tags">${e.tags.map(t=>`<span>#${esc(t)}</span>`).join('')}</div></article>`}).join('')||'<p>還沒有記事。</p>';
 const shown=E.filter(e=>cur==='全部'||e.type===cur);
 document.querySelectorAll('.copy button').forEach(b=>b.onclick=()=>{const t=shown[b.dataset.i].social[b.dataset.k];const pre=document.getElementById('pre'+b.dataset.i);pre.textContent=t;pre.classList.add('show');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{const o=b.textContent;b.textContent='✅ 已複製';setTimeout(()=>b.textContent=o,1400)}).catch(()=>{})});
 document.querySelectorAll('.zoom').forEach(im=>im.onclick=()=>{const lb=document.getElementById('lb');lb.querySelector('img').src=im.src;lb.style.display='flex'});}
document.getElementById('lb').onclick=e=>e.currentTarget.style.display='none';render();
</script></body></html>
