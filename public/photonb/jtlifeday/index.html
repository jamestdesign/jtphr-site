<!doctype html>
<html lang="zh-TW" data-skin="wenqing"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/><title>JT Life Day · 生活記事</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--ink:#2d2a26;--muted:#8a8174;--line:#d9cfbf;--card:#fffdf8;--accent:#a4572b;--font:'Noto Serif TC',serif}
*{box-sizing:border-box} html,body{overflow-x:hidden} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.9;transition:background .3s,color .3s}
.wrap{max-width:760px;margin:0 auto;padding:1.4rem 16px 5rem}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:.9rem;margin-bottom:1.6rem}
h1{font-size:1.5rem;margin:0;letter-spacing:.12em;font-weight:900} h1 small{display:block;font-size:.7rem;color:var(--muted);letter-spacing:.35em;font-weight:400}
.skins button,.filters button,.copy button{font-family:inherit;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.2rem .8rem;font-size:.78rem;cursor:pointer}
.skins button.on,.filters button.on{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.filters{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 1.4rem}
article{background:var(--card);border:1px solid var(--line);margin:0 0 2.4rem;padding:1.3rem 1.2rem 1.1rem}
.date{font-size:.74rem;letter-spacing:.3em;color:var(--muted)} h2{font-size:1.25rem;margin:.2rem 0 .3rem;font-weight:600}
.meta{font-size:.8rem;color:var(--muted);margin-bottom:.9rem} .meta b{color:var(--accent);font-weight:600}
.hero{width:100%;display:block} .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px} .thumbs figure{margin:0} .thumbs img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;cursor:zoom-in}
figcaption{font-size:.72rem;color:var(--muted);margin-top:.2rem;line-height:1.5}
.mood{font-size:1rem;margin:1rem 0 .6rem;padding-left:.9rem;border-left:3px solid var(--accent)}
h3{font-size:.78rem;letter-spacing:.28em;color:var(--accent);margin:1.2rem 0 .3rem;font-weight:600} ul{margin:.2rem 0;padding-left:1.1rem} li{margin:.15rem 0;font-size:.92rem}
.kcal{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:0 .5rem;margin-left:.3rem;color:var(--muted)}
.warn{font-size:.8rem;color:var(--accent)} .ocr{font-size:.82rem;color:var(--muted)} .ocr span{color:var(--ink)}
.copy{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem} .copy button:hover{color:var(--ink);border-color:var(--ink)}
pre{white-space:pre-wrap;font-family:inherit;font-size:.86rem;background:transparent;border:1px dashed var(--line);padding:.7rem .8rem;margin:.5rem 0 0;display:none} pre.show{display:block}
.tags{margin-top:.9rem;font-size:.74rem;color:var(--muted)} .tags span{margin-right:.6rem}
/* 文青：紙感、拍立得留白 */
:root[data-skin="wenqing"] article{box-shadow:0 8px 24px rgba(80,60,30,.08);border-radius:2px} :root[data-skin="wenqing"] .hero{padding:10px 10px 0;background:#fff;border:1px solid var(--line);border-bottom:0} :root[data-skin="wenqing"] .herocap{background:#fff;border:1px solid var(--line);border-top:0;padding:.35rem 10px .6rem;font-size:.78rem;color:var(--muted);text-align:center;letter-spacing:.1em}
/* 電影：寬銀幕、字幕、時間碼 */
figure.vid{position:relative} figure.vid::after{content:'▶';position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:44px;height:44px;line-height:44px;text-align:center;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:18px;pointer-events:none}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out} #lb img,#lb video{max-width:96vw;max-height:88vh;display:block} #lb .nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.14);color:#fff;border:0;width:46px;height:64px;font-size:26px;cursor:pointer;border-radius:8px} #lb .prev{left:8px} #lb .next{right:8px} #lb .x{position:fixed;top:10px;right:12px;background:transparent;border:0;color:#fff;font-size:30px;cursor:pointer} #lb .cap{position:fixed;left:0;right:0;bottom:12px;text-align:center;color:#ddd;font-size:.82rem;padding:0 3.5rem;font-family:'Noto Sans TC',sans-serif}
.lock{margin-top:1rem;border:1px dashed var(--line);padding:.6rem .8rem;font-size:.86rem} .lock button{font-family:inherit;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:.15rem .8rem;font-size:.78rem;cursor:pointer} .lock table{border-collapse:collapse;width:100%;margin:.3rem 0} .lock td{border-bottom:1px solid var(--line);padding:.25rem .3rem;font-size:.86rem} .lock td.amt{text-align:right;font-family:ui-monospace,Menlo,monospace;white-space:nowrap} .lock .sum{font-weight:700;color:var(--accent)} .lock pre{display:block;border:0;padding:0;margin:.3rem 0 0;font-size:.84rem}
.docs{margin-top:.8rem;display:grid;gap:.4rem} .doc{display:flex;align-items:center;gap:.6rem;font-size:.86rem;border:1px solid var(--line);padding:.45rem .6rem;background:rgba(127,127,127,.06)} .doc .dico{flex:none;font-family:ui-monospace,Menlo,monospace;font-size:.62rem;font-weight:700;background:var(--accent);color:var(--bg);padding:.15rem .35rem;border-radius:3px} .doc .dt{flex:1;min-width:0} .doc a{flex:none;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:0 .6rem;font-size:.76rem}
.key{color:var(--accent)!important;border-color:var(--accent)!important} .key.in{background:var(--accent)!important;color:var(--bg)!important} h2 .pk{font-size:.8rem;margin-left:.5rem;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:.05rem .5rem;color:var(--muted);vertical-align:middle;font-weight:400;white-space:nowrap} h2 .pk.on{color:var(--bg);background:var(--accent);border-color:var(--accent)} #pend{display:none;border:1px solid var(--accent);padding:.6rem .8rem;margin:0 0 1.2rem;font-size:.84rem} #pend textarea{width:100%;min-height:3.6rem;margin-top:.4rem;background:transparent;color:var(--ink);border:1px dashed var(--line);font-family:ui-monospace,Menlo,monospace;font-size:.78rem;padding:.4rem} #pend button{font-family:inherit;background:var(--accent);color:var(--bg);border:0;border-radius:999px;padding:.15rem .8rem;font-size:.78rem;cursor:pointer;margin-top:.3rem}
h2 .pk select,.aud{font-family:inherit;font-size:.74rem} h2 .pk.on{background:transparent;color:var(--ink);border-color:var(--accent)} h2 .pk select{background:transparent;border:0;color:var(--accent);cursor:pointer} .aud{margin-left:.3rem} .aud label{margin-right:.3rem;cursor:pointer}
.more{display:none} .more.open{display:block} .morebtn{font-family:inherit;display:block;width:100%;margin-top:.8rem;background:transparent;color:var(--muted);border:1px dashed var(--line);padding:.35rem;font-size:.8rem;cursor:pointer} .morebtn:hover{color:var(--ink);border-color:var(--ink)}
h2,figcaption,.mood,.date,.meta,.doc .dt,li,.herocap{word-break:keep-all;overflow-wrap:anywhere;line-break:strict} h2{text-wrap:balance} .date .cat,.meta b,.meta .np{white-space:nowrap}
.clips{display:flex;flex-direction:column;gap:10px;margin-top:10px} .clip{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px} .clip img{width:96px;height:96px;object-fit:cover;object-position:top;border-radius:6px;flex:none;cursor:zoom-in} .clip .ct{min-width:0;flex:1} .clip .kind{display:inline-block;font-size:.68rem;letter-spacing:.08em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 .45rem;margin-right:.4rem;vertical-align:middle} .clip b{font-size:.92rem} .clip .sum{font-size:.84rem;color:var(--muted);margin-top:.2rem;line-height:1.6} .clip .pl{font-size:.78rem;margin-top:.2rem} .clip details.ocr{margin-top:.3rem} .clip details.ocr summary{font-size:.74rem;color:var(--accent);cursor:pointer} .clip pre{white-space:pre-wrap;font-family:inherit;font-size:.8rem;line-height:1.6;background:color-mix(in srgb,var(--line) 35%,transparent);padding:.5rem .7rem;border-radius:6px;margin:.3rem 0 0;max-height:320px;overflow:auto}
details.sec{margin-top:10px;border-top:1px solid var(--line)} details.sec>summary{cursor:pointer;list-style:none;font-size:.86rem;color:var(--muted);padding:.5rem 0;letter-spacing:.08em;display:flex;align-items:center;gap:.4rem} details.sec>summary::-webkit-details-marker{display:none} details.sec>summary::before{content:"▸";display:inline-block;transition:transform .2s} details.sec[open]>summary::before{transform:rotate(90deg)} details.sec .thumbs{margin-top:2px}
.thumbs figure{position:relative} .thumbs .star{position:absolute;top:6px;left:6px;font-size:.66rem;letter-spacing:.05em;color:#ffd166;background:rgba(0,0,0,.55);padding:.1rem .4rem;border-radius:999px;pointer-events:none} .thumbs .star.r5{color:#ff8fa3}
@media (max-width:480px){.thumbs{grid-template-columns:repeat(2,1fr)} .doc{flex-wrap:wrap} .doc .dt{flex-basis:100%}}
.cal{display:none;border:1px solid var(--line);background:var(--card);padding:.7rem .8rem 1rem;margin:0 0 1.2rem;max-width:460px} .cal.open{display:block}
.cal .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem} .cal .ch b{letter-spacing:.15em;font-size:.95rem} .cal .ch button{font-family:inherit;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;width:2rem;height:2rem;cursor:pointer}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center} .cal .wd{font-size:.68rem;color:var(--muted);letter-spacing:.1em;padding:.2rem 0}
.cal .d{height:2.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.86rem;color:var(--muted);border-radius:8px;border:1px solid transparent;position:relative}
.cal .d.has{color:var(--ink);background:color-mix(in srgb,var(--accent) 10%,transparent);cursor:pointer;font-weight:600} .cal .d.has:hover{border-color:var(--accent)} .cal .d .dots{display:flex;gap:2px;align-items:center;margin-top:2px;height:6px} .cal .d .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block} .cal i.c-life{background:var(--accent)} .cal i.c-trip{background:#2f8a9a} .cal i.c-biz{background:#5a6b9e} .cal i.c-clip{background:#8a6bb5} .cal .cf .lg{margin-left:.8rem;white-space:nowrap} .cal .cf .lg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 .25rem 0 .1rem;vertical-align:middle} .cal .d .dots b{font-size:.55rem;line-height:1;color:var(--accent);font-weight:600}
.cal .d.sel{background:var(--accent);color:var(--bg)} .cal .d.sel .dots i{background:var(--bg)!important} .cal .d.sel .dots b{color:var(--bg)} .cal .d.today{text-decoration:underline}
.cal .cf{font-size:.76rem;color:var(--muted);margin-top:.5rem} .cal .cf button{font-family:inherit;background:transparent;border:1px solid var(--line);color:var(--accent);border-radius:999px;padding:.1rem .6rem;font-size:.74rem;cursor:pointer;margin-left:.4rem}
.sbox{display:flex;align-items:center;gap:.6rem;margin:.6rem 0 .2rem} .sbox input{flex:1;min-width:0;font-family:inherit;font-size:.92rem;padding:.55rem .9rem;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--fg);outline:none} .sbox input:focus{border-color:var(--accent)} .sbox input::placeholder{color:var(--muted)} #qn{font-size:.74rem;color:var(--muted);white-space:nowrap}
article[id^="d-"]{scroll-margin-top:12px}
footer{color:var(--muted);font-size:.72rem;text-align:center;margin-top:3rem;letter-spacing:.1em}
</style></head><body><div class="wrap">
<header><h1><small>JT LIFE DAY</small>生活記事</h1><div class="skins"><a id="ledgerbtn" href="ledger.html" style="display:none;text-decoration:none;font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:.2rem .8rem;color:var(--accent)">💰 帳務</a> <button id="calbtn" title="月曆">📅</button> <button id="keybtn" class="key" title="登入／登出">🔑 登入</button></div></header>
<div class="sbox"><input id="q" type="search" placeholder="🔍 搜尋記事：店名、地點、菜色、人、標籤、內文…" autocomplete="off"><span id="qn"></span></div>
<div id="cal" class="cal"></div><div id="pend"></div><div class="filters" id="filters"></div><main id="list"></main>
<footer>拍照＋一句話，其餘交給 Robert · 私人記事，未列入索引</footer></div><div id="lb"><button class="x" aria-label="關閉">×</button><button class="nav prev" aria-label="上一張">‹</button><div id="lbbox"></div><button class="nav next" aria-label="下一張">›</button><div class="cap" id="lbcap"></div></div>
<script>
let E=[];let PW=null,ROLE=null,WHO='',TOTAL=0;const VISL={public:'🌐 公開',login:'🔒 登入才看',audience:'👥 指定同行'};const GUESTS=['HU','LI','EVA'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setSkin(s){document.documentElement.dataset.skin=s;document.querySelectorAll('.skins button[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===s));try{localStorage.setItem('lifeday_skin',s)}catch(e){}}
setSkin('wenqing');   // James 2026-09-23：電影風移除，只留文青
document.querySelectorAll('.skins button[data-s]').forEach(b=>b.onclick=()=>setSkin(b.dataset.s));
let cur='全部',curT='全部';
const F=document.getElementById('filters');
function drawFilters(){const CATS=['全部',...new Set(E.map(e=>e.category||'生活'))];const types=['全部',...new Set(E.filter(e=>cur==='全部'||(e.category||'生活')===cur).map(e=>e.type))];
 F.innerHTML='<div style="display:flex;gap:.4rem;flex-wrap:wrap;width:100%">'+CATS.map(t=>`<button data-c="${esc(t)}" class="${t===cur?'on':''}">${esc(t)}</button>`).join('')+'</div><div style="display:flex;gap:.4rem;flex-wrap:wrap;width:100%">'+types.map(t=>`<button data-t="${esc(t)}" class="${t===curT?'on':''}">${t==='全部'?'全部類型':esc(t)}</button>`).join('')+'</div>';
 F.querySelectorAll('button[data-c]').forEach(b=>b.onclick=()=>{cur=b.dataset.c;curT='全部';drawFilters();render()});
 F.querySelectorAll('button[data-t]').forEach(b=>b.onclick=()=>{curT=b.dataset.t;drawFilters();render()});}
let curDay=null;
let curQ='';
const hay=e=>{const parts=[e.date,e.title,e.place,e.people,e.mood,e.verdict,e.type,e.category,(e.tags||[]).join(' '),(e.dishes||[]).map(d=>d.name+' '+d.detail).join(' '),(e.sections||[]).map(s=>s.h+' '+s.items.join(' ')).join(' '),(e.ocr||[]).map(o=>o.jp+' '+o.zh).join(' '),(e.docs||[]).map(x=>x.title).join(' '),(e.photos||[]).map(p=>p.cap).join(' '),e.social?Object.values(e.social).join(' '):'',(e.clips||[]).map(x=>[x.kind,x.title,x.summary,x.ocr,x.place,(x.tags||[]).join(' ')].join(' ')).join(' '),e._priv?JSON.stringify(e._priv):''];return parts.join('\n').toLowerCase();};
const qhit=e=>{if(!curQ)return true;const h=hay(e);return curQ.split(/\s+/).filter(Boolean).every(w=>h.includes(w));};
const pass=e=>(cur==='全部'||(e.category||'生活')===cur)&&(curT==='全部'||e.type===curT)&&(!curDay||e.date===curDay)&&qhit(e);
const Q=document.getElementById('q');let qt=null;Q.oninput=()=>{clearTimeout(qt);qt=setTimeout(()=>{curQ=Q.value.trim().toLowerCase();render();drawCal();},180);};
Q.onkeydown=ev=>{if(ev.key==='Escape'){Q.value='';curQ='';render();drawCal();}};
drawFilters();
const SECS=[['人像','👤 人像'],['風景','🌄 風景'],['食物','🍽 食物'],['其他','📎 其他']];
const stars=r=>r?`<span class="star r${r}">${'★'.repeat(+r)}</span>`:'';
const fig=(i,n,src,cap,r,cls)=>`<figure class="${cls||''}">${stars(r)}<img class="zoom" data-e="${i}" data-n="${n}" src="${src}" alt="" loading="lazy">${cap!==undefined?`<figcaption>${esc(cap)}</figcaption>`:''}</figure>`;
function thumbsHTML(e,i,base){const rest=e.photos.slice(1),gridN=e.photos.length,albN=gridN+(e.grid?1:0);
 const gridFig=e.grid?fig(i,gridN,base+e.grid,'拼貼（可直接發）'):'';
 let h='';
 if(rest.some(p=>p.sec)){ // James 2026-09-23：人像／風景／食物分三區，各自展開收攏
  for(const [k,label] of SECS){const ps=rest.map((p,j)=>[p,j+1]).filter(([p])=>(p.sec||'其他')===k);if(!ps.length)continue;
   h+=`<details class="sec"><summary>${label}（${ps.length}）</summary><div class="thumbs">${ps.map(([p,n])=>fig(i,n,base+p.f,p.cap,p.r,p.video?'vid':'')).join('')}${k==='其他'?gridFig:''}</div></details>`;}
  if(!rest.some(p=>(p.sec||'其他')==='其他')&&gridFig)h+=`<div class="thumbs">${gridFig}</div>`;
 }else if(rest.length||gridFig) h+=`<details class="sec"><summary>📷 照片（${rest.length+(e.grid?1:0)}）</summary><div class="thumbs">${rest.map((p,k)=>fig(i,k+1,base+p.f,p.cap,p.r,p.video?'vid':'')).join('')}${gridFig}</div></details>`;   // James 2026-09-23：沒分區也先收攏，免閱讀疲勞
 if((e.album||[]).length) h+=`<details class="sec album"><summary>🗂 相簿・其餘出片（${e.album.length} 張，標星等）</summary><div class="thumbs">${e.album.map((p,k)=>fig(i,albN+k,base+p.f,undefined,p.r)).join('')}</div></details>`;
 return h;}
function render(){document.getElementById('list').innerHTML=E.filter(e=>pass(e)&&visible(e)).map((e,i)=>{const base=e.base||('img/'+e.date+'/');e.photos=e.photos||[];const hero=e.photos[0];
 return `<article id="d-${esc(e.date)}-${i}" data-date="${esc(e.date)}">${hero?`<div class="herowrap"><img class="hero zoom" data-e="${i}" data-n="0" src="${base+hero.f}" alt=""><div class="herocap">${esc(hero.cap)}</div></div>`:''}
 <div class="date">${esc(e.date)}（${esc(e.weekday)}）${esc(e.time)}　·　<span class="cat">${esc(e.category||'生活')}／${esc(e.type)}</span></div><h2>${esc(e.title)}${visUI(e)}</h2>
 <div class="meta">📍 ${esc(e.place)}${e.kcal_total?`　·　估 <b>${e.kcal_total}</b> 大卡`:''}${e.people?`　·　${e.type==='餐食'?'同行：':''}${esc(e.people)}`:''}${e.voiceover?'　·　🎙️ 口播素材':''}</div>
 ${thumbsHTML(e,i,base)}
 ${(e.docs||[]).length?`<div class="docs">${e.docs.map(x=>`<div class="doc"><span class="dico">PDF</span><span class="dt">${esc(x.title)}</span><a href="${base+x.file}" target="_blank" rel="noopener">預覽</a><a href="${base+x.file}" download>下載</a></div>`).join('')}</div>`:''}
 ${(e.clips||[]).length?`<div class="clips">${e.clips.map((x,k)=>`<div class="clip"><img class="zoom" data-e="${i}" data-n="${(e.photos||[]).length+(e.grid?1:0)+(e.album||[]).length+k}" src="${base+x.f}" alt="" loading="lazy"><div class="ct"><span class="kind">${esc(x.kind||'')}</span><b>${esc(x.title||'')}</b><div class="sum">${esc(x.summary||'')}</div>${x.ocr?`<details class="ocr"><summary>文字內容</summary><pre>${esc(x.ocr)}</pre></details>`:''}${x.place?`<div class="pl">📍 ${esc(x.place)}</div>`:''}</div></div>`).join('')}</div>`:''}
 ${e.mood?`<div class="mood">${esc(e.mood)}</div>`:''}
 <div class="more" id="more${i}">
 ${e.dishes?`<h3>吃了什麼</h3><ul>${e.dishes.map(d=>`<li><b>${esc(d.name)}</b><span class="kcal">約 ${d.kcal} 大卡</span><br>${esc(d.detail)}${d.confirm?`<div class="warn">⚠️ ${esc(d.confirm)}</div>`:''}</li>`).join('')}</ul>`:''}
 ${(e.sections||[]).map(sec=>`<h3>${esc(sec.h)}</h3><ul>${sec.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')}
 ${e.verdict?`<h3>${e.type==='餐食'?'評價':'我的結論'}</h3>`:''}<div>${e.rating?('★'.repeat(e.rating)+'　'):''}${esc(e.verdict||'')}</div>
  ${(e.ocr||[]).length?'<h3>照片裡的文字</h3>':''}${(e.ocr||[]).map(o=>`<div class="ocr">${esc(o.src)}：${esc(o.jp)} → <span>${esc(o.zh)}</span></div>`).join('')}
 ${e.social?'<h3>拿去發文</h3>':''}<div class="copy" ${e.social?'':'style="display:none"'}>${['ig','fb','threads'].map(k=>`<button data-i="${i}" data-k="${k}">複製 ${k==='ig'?'IG':k==='fb'?'FB':'Threads'} 文案</button>`).join('')}</div><pre id="pre${i}"></pre>
 ${e._priv?`<div class="lock">🔓 ${privHTML(e._priv)}</div>`:''}
 </div><button class="morebtn" data-i="${i}">▾ 展開全文</button>
 <div class="tags">${(e.tags||[]).map(t=>`<span>#${esc(t)}</span>`).join('')}</div></article>`}).join('')||(PW?(ROLE==='admin'?'<p>還沒有記事。</p>':'<p style="text-align:center;color:var(--muted);padding:3rem 0">還沒有標到 '+esc(WHO)+' 的記事。</p>'):'<p style="text-align:center;color:var(--muted);padding:3rem 0">🔐 這裡的記事預設都是鎖住的。<br>按右上角「🔑 登入」後顯示。</p>');
 const shown=E.filter(e=>pass(e)&&visible(e));
 document.getElementById('qn').textContent=curQ?`找到 ${shown.length} 篇`:'';
 document.querySelectorAll('.copy button').forEach(b=>b.onclick=()=>{const t=shown[b.dataset.i].social[b.dataset.k];const pre=document.getElementById('pre'+b.dataset.i);pre.textContent=t;pre.classList.add('show');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{const o=b.textContent;b.textContent='✅ 已複製';setTimeout(()=>b.textContent=o,1400)}).catch(()=>{})});
 document.querySelectorAll('.zoom').forEach(im=>im.onclick=()=>openLB(shown[+im.dataset.e],+im.dataset.n));
 document.querySelectorAll('.vis').forEach(sel=>sel.onchange=()=>setVis(sel.dataset.id,sel.value,null));document.querySelectorAll('.aud input').forEach(cb=>cb.onchange=()=>{const box=cb.closest('.aud');setVis(box.dataset.id,'audience',[...box.querySelectorAll('input:checked')].map(x=>x.value));});
 document.querySelectorAll('.morebtn').forEach(b=>b.onclick=()=>{const m=document.getElementById('more'+b.dataset.i);const o=m.classList.toggle('open');b.textContent=o?'▴ 收合':'▾ 展開全文';});}
function privHTML(P){let h='';if(P.spend&&P.spend.length){const sums={};P.spend.forEach(x=>{const c=x.cur||'NT$';sums[c]=(sums[c]||0)+(+x.amount||0)});
  h+='<table>'+P.spend.map(x=>`<tr><td>${esc(x.item)}${x.invoice_no?` <span style="color:var(--muted)">${esc(x.invoice_no)}</span>`:''}${x.pay?` · ${esc(x.pay)}`:''}</td><td class="amt">${esc(x.cur||'NT$')} ${(+x.amount).toLocaleString()}</td></tr>`).join('')+Object.entries(sums).map(([c,v])=>`<tr><td class="sum">合計</td><td class="amt sum">${esc(c)} ${v.toLocaleString()}</td></tr>`).join('')+`</table>`;}
 if(P.partner)h+=`<div>🤝 ${esc(P.partner)}</div>`;if(P.background)h+=`<div style="margin-top:.4rem"><b>${esc(P.background.title)}</b><pre>${esc(P.background.text)}</pre></div>`;if(P.note)h+=`<div style="color:var(--muted);font-size:.78rem">${esc(P.note)}</div>`;return h||'（沒有內容）';}
function visUI(e){if(ROLE!=='admin')return '';const v=e.visibility||'audience';const aud=e.audience||[];
 return `<span class="pk on"><select class="vis" data-id="${esc(e.id)}" title="這篇誰看得到">${Object.entries(VISL).map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${l}</option>`).join('')}</select>${v==='audience'?`<span class="aud" data-id="${esc(e.id)}">${GUESTS.map(g=>`<label><input type="checkbox" value="${g}" ${aud.includes(g)?'checked':''}>${g}</label>`).join('')}</span>`:''}</span>`;}
async function setVis(id,vis,aud){const e=E.find(x=>x.id===id);if(!e)return;const body={visibility:vis};if(aud)body.audience=aud;
 const r=await fetch('/api/lifeday/entries/'+encodeURIComponent(id),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok){alert('沒存成功：'+r.status);return;}const j=await r.json();e.visibility=j.visibility;e.audience=j.audience;render();}
const visible=e=>true;   // 伺服器已依身分過濾
async function loadEntries(){const r=await fetch('/api/lifeday/entries',{cache:'no-store'});if(!r.ok){document.getElementById('list').innerHTML='<p style="text-align:center;color:var(--muted);padding:3rem 0">⚠️ 連不上記事資料庫（'+r.status+'）</p>';return;}
 const j=await r.json();E=j.entries;TOTAL=j.total;if(j.me&&j.me.name){PW=true;ROLE=j.me.role;WHO=j.me.name;}else{PW=null;ROLE=null;WHO='';}
 E.sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));keyUI();drawFilters();render();drawCal();}
async function login(user,pw,quiet){const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:user||'',password:pw})});
 if(!r.ok){if(!quiet)alert('帳號或密碼不對');return false;}await loadEntries();return true;}
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload();}
function keyUI(){document.getElementById('ledgerbtn').style.display=(ROLE==='admin')?'inline-block':'none';const k=document.getElementById('keybtn');k.textContent=PW?('🔓 '+(ROLE==='admin'?'已登入 James':WHO)):'🔑 登入';k.classList.toggle('in',!!PW);}
document.getElementById('keybtn').onclick=()=>{if(PW){if(confirm('登出？'))logout();}else{const pw=prompt('輸入密碼登入（四個帳號各自的密碼）');if(pw)login('',pw,false);}};
document.addEventListener('click',ev=>{const b=ev.target.closest('.unlock');if(!b)return;const pw=prompt('輸入密碼登入');if(pw)login('',pw,false);});

// ── 月曆（James 2026-09-22）：📅 展開；有記事的日子標點（登入前只算公開篇）；點日期＝只看那天＋捲到那天第一篇；再點取消
const CAL=document.getElementById('cal'); let calY=new Date().getFullYear(), calM=new Date().getMonth(), calOpen=false;
const CATC={'生活':'c-life','旅遊':'c-trip','商務':'c-biz','收藏':'c-clip'};   // James 2026-09-23：月曆的點依 分類 上色
function daysWithPosts(){const m=new Map(); E.forEach(e=>{ if(qhit(e)){ if(!m.has(e.date)) m.set(e.date,[]); m.get(e.date).push(e.category||'生活'); } }); return m;}   // 日期→篇數（James 2026-09-23：一個點一件事）
function drawCal(){ if(!calOpen){CAL.classList.remove('open');return;} CAL.classList.add('open');
 const has=daysWithPosts(); const first=new Date(calY,calM,1); const startDow=(first.getDay()+6)%7; const nd=new Date(calY,calM+1,0).getDate(); const today=new Date().toISOString().slice(0,10);
 let h=`<div class="ch"><button data-m="-1">‹</button><b>${calY} 年 ${calM+1} 月</b><button data-m="1">›</button></div><div class="g">`+['一','二','三','四','五','六','日'].map(w=>`<div class="wd">${w}</div>`).join('');
 for(let i=0;i<startDow;i++) h+='<div class="d"></div>';
 for(let d=1;d<=nd;d++){ const key=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; const cats=has.get(key)||[]; const n=cats.length; const cls=['d',n?'has':'',key===curDay?'sel':'',key===today?'today':''].join(' '); const dot=c=>`<i class="${CATC[c]||'c-life'}"></i>`; h+=`<div class="${cls}" data-day="${key}" title="${n?n+' 篇':''}">${d}${n?`<span class="dots">${n<=5?cats.map(dot).join(''):cats.slice(0,4).map(dot).join('')+'<b>+'+(n-4)+'</b>'}</span>`:''}</div>`; }
 h+='</div>'; const months=[...has.keys()].map(x=>x.slice(0,7)).sort(); const cnt=[...has.keys()].filter(x=>x.startsWith(`${calY}-${String(calM+1).padStart(2,'0')}`)).length;
 h+=`<div class="cf">這個月有記事 ${cnt} 天・${[...has.entries()].filter(([k])=>k.startsWith(`${calY}-${String(calM+1).padStart(2,'0')}`)).reduce((a,[,v])=>a+v.length,0)} 篇<span class="lg"><i class="c-life"></i>生活 <i class="c-trip"></i>旅遊 <i class="c-biz"></i>商務 <i class="c-clip"></i>收藏</span>${curDay?`　·　正在只看 ${curDay}<button id="calclear">全部顯示</button>`:''}${months.length?`　·　最早 ${months[0]}`:''}</div>`;
 CAL.innerHTML=h;
 CAL.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{calM+=+b.dataset.m; if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;} drawCal();});
 CAL.querySelectorAll('.d.has').forEach(d=>d.onclick=()=>{ const k=d.dataset.day; curDay=(curDay===k)?null:k; drawFilters(); render(); drawCal(); if(curDay){ const a=document.querySelector(`article[data-date="${curDay}"]`); if(a) a.scrollIntoView({behavior:'smooth',block:'start'}); } });
 const cc=document.getElementById('calclear'); if(cc) cc.onclick=()=>{curDay=null;drawFilters();render();drawCal();};
}
document.getElementById('calbtn').onclick=()=>{ calOpen=!calOpen; if(calOpen){ const days=[...daysWithPosts().keys()].sort(); if(days.length&&!curDay){ const last=days[days.length-1]; calY=+last.slice(0,4); calM=+last.slice(5,7)-1; } } drawCal(); };
const LB=document.getElementById('lb'),BOX=document.getElementById('lbbox'),CAP=document.getElementById('lbcap');let G=[],GI=0;
function openLB(e,n){const base=e.base||('img/'+e.date+'/');G=e.photos.map(p=>({src:base+p.f,video:p.video?base+p.video:null,cap:p.cap}));if(e.grid)G.push({src:base+e.grid,video:null,cap:'拼貼'});(e.album||[]).forEach(p=>G.push({src:base+p.f,video:null,cap:(p.r?'★'.repeat(+p.r)+'　':'')+(p.cap||p.name||'')}));(e.clips||[]).forEach(x=>G.push({src:base+x.f,video:null,cap:x.title||''}));GI=n;LB.style.display='flex';showLB();}
function showLB(){const g=G[GI];BOX.innerHTML=g.video?`<video src="${g.video}" poster="${g.src}" controls autoplay playsinline loop></video>`:`<img src="${g.src}" alt="">`;CAP.textContent=(GI+1)+' / '+G.length+'　'+g.cap;}
function stepLB(d){GI=(GI+d+G.length)%G.length;showLB();}
function closeLB(){LB.style.display='none';BOX.innerHTML='';}
LB.querySelector('.prev').onclick=e=>{e.stopPropagation();stepLB(-1)};LB.querySelector('.next').onclick=e=>{e.stopPropagation();stepLB(1)};LB.querySelector('.x').onclick=closeLB;
LB.onclick=e=>{if(e.target===LB)closeLB()};
document.addEventListener('keydown',e=>{if(LB.style.display!=='flex')return;if(e.key==='ArrowLeft')stepLB(-1);else if(e.key==='ArrowRight')stepLB(1);else if(e.key==='Escape')closeLB();});
let tx=null,ty=null;LB.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
LB.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3)stepLB(dx<0?1:-1);else if(dy>90&&Math.abs(dy)>Math.abs(dx))closeLB();},{passive:true});
loadEntries();
</script></body></html>
